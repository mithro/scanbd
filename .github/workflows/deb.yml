name: Build deb + publish apt repo

# Builds the welland patched scanbd deb (fixes pixma button presses never
# firing an action) on native arm64 + amd64 runners, then publishes a
# GPG-signed flat apt repo to GitHub Pages at https://mithro.github.io/scanbd/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: deb (${{ matrix.suite }} ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, sid]
        # riscv64 is an official Debian architecture from trixie onwards, so it
        # is available for every suite built here.
        arch: [amd64, arm64, armhf, riscv64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so deb-version.py can describe

      - uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}
          build-deps: >-
            pkg-config libsane-dev libconfuse-dev libudev-dev libdbus-1-dev libusb-1.0-0-dev

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          if-no-files-found: error

  publish-apt:
    # Build on PRs to validate, but never publish from one.
    if: github.event_name != 'pull_request'
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie sid"
      architectures: "amd64 arm64 armhf riscv64"
      origin: scanbd
      description: "Welland patched scanbd (SANE button daemon)"
      keyring-name: scanbd.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
